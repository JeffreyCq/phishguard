services:

  # ─── Local AI model (Ollama) ──────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=1        # one request at a time to save RAM
      - OLLAMA_MAX_LOADED_MODELS=1   # keep only one model in memory
      - OLLAMA_KEEP_ALIVE=10m        # unload model after 10 min idle
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G                 # qwen2.5:3b uses ~2 GB; cap at 4 GB

  # ─── FastAPI backend ─────────────────────────────────────────────────────
  backend:
    build: ./backend
    expose:
      - "8000"
    ports:
      - "25:2525"                    # SMTP inbound: host port 25 → container 2525
    environment:
      # AI (local Ollama)
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      # Threat intelligence APIs (optional — features degrade gracefully)
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY}
      - URLSCAN_API_KEY=${URLSCAN_API_KEY}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY}
      # Public REST API key
      - PUBLIC_API_KEY=${PUBLIC_API_KEY}
      # SMTP outbound — needed to send analysis reply emails
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      # SMTP inbound listener
      - SMTP_LISTEN_PORT=2525
      - SMTP_LISTEN_HOST=0.0.0.0
    depends_on:
      - ollama
    restart: unless-stopped

  # ─── React frontend (Nginx) ───────────────────────────────────────────────
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data:    # persists downloaded models across restarts
