services:

  # ─── FastAPI backend ─────────────────────────────────────────────────────
  backend:
    build: ./backend
    expose:
      - "8000"
    ports:
      - "25:2525"                    # SMTP inbound: host port 25 → container 2525
    environment:
      # ML Classifier microservice (DistilBERT/ONNX — deployed separately)
      - ML_SERVICE_URL=${ML_SERVICE_URL:-https://ml.maildefender.xyz}
      # Threat intelligence APIs (optional — features degrade gracefully)
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY}
      - URLSCAN_API_KEY=${URLSCAN_API_KEY}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY}
      # Enables /admin/* (issue API keys, export feedback)
      - ADMIN_SECRET=${ADMIN_SECRET}
      # SMTP outbound — needed to send analysis reply emails
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      # SMTP inbound listener
      - SMTP_LISTEN_PORT=2525
      - SMTP_LISTEN_HOST=0.0.0.0
    restart: unless-stopped

  # ─── React frontend (Nginx) ───────────────────────────────────────────────
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
